<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="山姆代购">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>山姆代购管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7fa;
    color: #333;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== Header ===== */
  .app-header {
    background: #fff;
    padding: 14px 16px 10px;
    border-bottom: 1px solid #e8ecf0;
    flex-shrink: 0;
  }
  .app-header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #1a2232;
  }
  .app-header p {
    font-size: 12px;
    color: #8a94a6;
    margin-top: 2px;
  }

  /* ===== Main scroll area ===== */
  .main-content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ===== Tab panels ===== */
  .tab-panel { display: none; padding: 16px; }
  .tab-panel.active { display: block; }

  /* ===== Bottom nav ===== */
  .bottom-nav {
    display: flex;
    background: #fff;
    border-top: 1px solid #e8ecf0;
    flex-shrink: 0;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 4px 12px;
    background: none;
    border: none;
    cursor: pointer;
    color: #8a94a6;
    font-size: 11px;
    gap: 3px;
    transition: color .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn .nav-icon { font-size: 20px; line-height: 1; }
  .nav-btn.active { color: #2563eb; }
  .nav-btn.active .nav-label { font-weight: 600; }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: background .15s, transform .1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: #f0f4ff; color: #2563eb; border: 1px solid #c7d7fd; }
  .btn-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .btn-full { width: 100%; }

  /* ===== Textarea ===== */
  .text-input {
    width: 100%;
    border: 1px solid #d1d9e6;
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.6;
    font-family: inherit;
    resize: vertical;
    outline: none;
    transition: border-color .2s;
    background: #fff;
  }
  .text-input:focus { border-color: #2563eb; }
  .label { font-size: 13px; font-weight: 600; color: #4b5563; margin-bottom: 6px; display: block; }
  .hint { font-size: 12px; color: #9ca3af; margin-top: 6px; }

  /* ===== Stats bar ===== */
  .stats-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat-card {
    flex: 1;
    background: #fff;
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .stat-num { font-size: 22px; font-weight: 700; color: #1a2232; }
  .stat-label { font-size: 11px; color: #8a94a6; margin-top: 1px; }

  /* ===== Progress bar ===== */
  .progress-wrap { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .progress-title { font-size: 13px; font-weight: 600; color: #4b5563; }
  .progress-pct { font-size: 13px; font-weight: 700; color: #2563eb; }
  .progress-track { background: #e8ecf0; border-radius: 99px; height: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: #2563eb; border-radius: 99px; transition: width .4s ease; }

  /* ===== Filter bar ===== */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .search-wrap { flex: 1 1 100%; position: relative; }
  .search-input {
    width: 100%;
    border: 1px solid #d1d9e6;
    border-radius: 8px;
    padding: 9px 12px 9px 36px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    background: #fff;
  }
  .search-input:focus { border-color: #2563eb; }
  .search-icon {
    position: absolute;
    left: 11px; top: 50%;
    transform: translateY(-50%);
    color: #9ca3af;
    font-size: 15px;
    pointer-events: none;
  }
  .filter-btns { display: flex; gap: 6px; }
  .filter-btn {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid #d1d9e6;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    color: #6b7280;
    transition: all .15s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .filter-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; }

  /* ===== Customer cards ===== */
  .card-list { display: flex; flex-direction: column; gap: 12px; }
  .customer-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
    overflow: hidden;
    border-left: 4px solid transparent;
  }
  .customer-card.new-customer { border-left-color: #16a34a; }
  .customer-card.all-done { border-left-color: #2563eb; }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .customer-name-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .seq-tag {
    font-size: 11px;
    font-weight: 700;
    color: #2563eb;
    background: #dbeafe;
    padding: 1px 7px;
    border-radius: 5px;
    min-width: 24px;
    text-align: center;
  }
  .customer-name { font-size: 15px; font-weight: 700; color: #1a2232; }
  .customer-tag {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 6px;
    margin-left: 4px;
  }
  .tag-new-customer { background: #dcfce7; color: #16a34a; }
  .badge {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .badge-done { background: #dcfce7; color: #16a34a; }
  .badge-progress { background: #dbeafe; color: #2563eb; }

  .card-items { padding: 0 14px 12px; }
  .item-row {
    display: flex;
    align-items: center;
    padding: 7px 0;
    border-top: 1px solid #f3f4f6;
    gap: 10px;
  }
  .item-row:first-child { border-top: none; }

  .item-checkbox {
    width: 20px; height: 20px;
    min-width: 20px;
    border-radius: 6px;
    border: 2px solid #d1d9e6;
    background: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .item-checkbox.checked {
    background: #2563eb;
    border-color: #2563eb;
  }
  .item-checkbox.checked::after {
    content: '✓';
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
  }
  .item-checkbox.removed { border-color: #fca5a5; background: #fef2f2; cursor: default; }

  .item-name {
    flex: 1;
    font-size: 14px;
    color: #1a2232;
    line-height: 1.4;
  }
  .item-name.done { text-decoration: line-through; color: #9ca3af; }
  .item-name.added { color: #16a34a; }
  .item-name.removed { text-decoration: line-through; color: #dc2626; }

  .item-tag {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .tag-added { background: #dcfce7; color: #16a34a; }
  .tag-removed { background: #fee2e2; color: #dc2626; }

  .qty-badge {
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    background: #f3f4f6;
    padding: 2px 7px;
    border-radius: 5px;
    white-space: nowrap;
  }

  /* ===== Empty state ===== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #9ca3af;
  }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* ===== Diff summary ===== */
  .diff-summary {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .diff-summary h3 { font-size: 14px; font-weight: 700; color: #15803d; margin-bottom: 8px; }
  .diff-row { font-size: 13px; color: #374151; line-height: 1.8; }
  .diff-plus { color: #16a34a; font-weight: 700; }
  .diff-minus { color: #dc2626; font-weight: 700; }

  /* ===== Section title ===== */
  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: #8a94a6;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin: 14px 0 10px;
  }

  .card-body-wrap { display: block; }

  .toast {
    position: fixed;
    bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30,40,60,.88);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s, transform .25s;
    z-index: 999;
    white-space: nowrap;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .gap-8 { margin-bottom: 8px; }
  .gap-12 { margin-bottom: 12px; }
  .gap-16 { margin-bottom: 16px; }

  /* ===== Brand word management ===== */
  .brand-panel {
    background: #fff;
    border: 1px solid #e8ecf0;
    border-radius: 12px;
    margin-top: 16px;
    overflow: hidden;
  }
  .brand-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .brand-panel-header:hover { background: #f9fafb; }
  .brand-panel-title {
    font-size: 14px;
    font-weight: 600;
    color: #374151;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .brand-panel-count {
    font-size: 11px;
    font-weight: 600;
    background: #dbeafe;
    color: #2563eb;
    padding: 1px 8px;
    border-radius: 10px;
  }
  .brand-panel-arrow {
    font-size: 12px;
    color: #9ca3af;
    transition: transform .2s;
  }
  .brand-panel.open .brand-panel-arrow {
    transform: rotate(180deg);
  }
  .brand-panel-body {
    display: none;
    padding: 0 14px 14px;
  }
  .brand-panel.open .brand-panel-body {
    display: block;
  }
  .brand-add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .brand-add-input {
    flex: 1;
    border: 1px solid #d1d9e6;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    background: #fff;
  }
  .brand-add-input:focus { border-color: #2563eb; }
  .brand-add-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .brand-add-btn:active { background: #1d4ed8; }
  .brand-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .brand-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.4;
  }
  .brand-tag-en {
    background: #dbeafe;
    color: #1d4ed8;
  }
  .brand-tag-multi {
    background: #fef3c7;
    color: #92400e;
  }
  .brand-tag-cn {
    background: #f3f4f6;
    color: #374151;
  }
  .brand-tag-del {
    font-size: 11px;
    cursor: pointer;
    opacity: .5;
    margin-left: 2px;
    -webkit-tap-highlight-color: transparent;
  }
  .brand-tag-del:hover { opacity: 1; }
  .brand-hint {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 8px;
    line-height: 1.5;
  }
  .brand-reset-btn {
    margin-top: 8px;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #d1d9e6;
    background: #fff;
    font-size: 12px;
    color: #6b7280;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .brand-reset-btn:active { background: #f3f4f6; }
</style>
</head>
<body>

<div class="app-header">
  <h1>🛒 山姆代购管理</h1>
  <p id="header-subtitle">导入接龙开始今天的采购</p>
</div>

<div class="main-content" id="main-content">

  <!-- Tab 1: 导入接龙 -->
  <div class="tab-panel active" id="tab-import">
    <label class="label gap-8">粘贴接龙文本</label>
    <textarea
      class="text-input gap-12"
      id="import-text"
      rows="14"
      placeholder="1. 陈月如 MM 鸡蛋 1，鲜花 1
2. 慢慢 雅漾喷雾四件套1、每益添苹果味1
3. 妮 花花
4. 珊珊 MM韩式风味烤鸡翅1
..."
    ></textarea>
    <div class="gap-8"></div>
    <button class="btn btn-primary btn-full" onclick="handleImport()">解析接龙</button>
    <p class="hint">解析完成后自动跳转到采购清单</p>
    <div class="gap-16"></div>
    <button class="btn btn-danger btn-full" onclick="handleClearAll()" id="clear-btn" style="display:none">清空所有数据重新开始</button>

    <!-- 品牌词管理 -->
    <div class="brand-panel" id="brand-panel">
      <div class="brand-panel-header" onclick="toggleBrandPanel()">
        <span class="brand-panel-title">
          🏷️ 品牌词管理
          <span class="brand-panel-count" id="brand-count">0</span>
        </span>
        <span class="brand-panel-arrow">▼</span>
      </div>
      <div class="brand-panel-body">
        <div class="brand-add-row">
          <input class="brand-add-input" id="brand-add-input" type="text" placeholder="输入品牌词，如：Oatly 或 Blue Monkey" onkeydown="if(event.key==='Enter')addBrandWord()">
          <button class="brand-add-btn" onclick="addBrandWord()">添加</button>
        </div>
        <div class="brand-tags" id="brand-tags"></div>
        <p class="brand-hint">
          💡 品牌词用于识别客户名和商品的边界。英文品牌支持多词（含空格），如 "Pick Up"。
          <br>🔵 蓝色=英文品牌 &nbsp; 🟡 黄色=多词品牌 &nbsp; ⬜ 灰色=中文关键词
        </p>
        <button class="brand-reset-btn" onclick="resetBrandWords()">恢复默认词表</button>
      </div>
    </div>
  </div>

  <!-- Tab 2: 采购清单 -->
  <div class="tab-panel" id="tab-list">
    <div id="list-empty" class="empty-state" style="display:none">
      <div class="empty-icon">📋</div>
      <p>还没有接龙数据<br>请先在「导入接龙」粘贴文本</p>
    </div>
    <div id="list-content" style="display:none">
      <!-- Stats -->
      <div class="stats-bar">
        <div class="stat-card">
          <div class="stat-num" id="stat-customers">0</div>
          <div class="stat-label">下单客户</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-total">0</div>
          <div class="stat-label">商品总件数</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-done">0</div>
          <div class="stat-label">已采购</div>
        </div>
      </div>
      <!-- Progress -->
      <div class="progress-wrap">
        <div class="progress-header">
          <span class="progress-title">采购进度</span>
          <span class="progress-pct" id="progress-pct">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
      <!-- Filter -->
      <div class="filter-bar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input
            class="search-input"
            id="search-input"
            type="text"
            placeholder="搜索客户名或商品名..."
            oninput="renderList()"
          >
        </div>
        <div class="filter-btns">
          <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
          <button class="filter-btn" data-filter="pending" onclick="setFilter('pending')">待采购</button>
          <button class="filter-btn" data-filter="done" onclick="setFilter('done')">已完成</button>
        </div>
      </div>
      <!-- Cards -->
      <div class="card-list" id="card-list"></div>
    </div>
  </div>

  <!-- Tab 3: 更新接龙 -->
  <div class="tab-panel" id="tab-update">
    <div id="diff-summary" style="display:none"></div>
    <label class="label gap-8">粘贴最新接龙文本</label>
    <textarea
      class="text-input gap-12"
      id="update-text"
      rows="14"
      placeholder="粘贴最新的接龙文本，系统将与当前清单对比，自动标记新增和取消的商品..."
    ></textarea>
    <div class="gap-8"></div>
    <button class="btn btn-primary btn-full" onclick="handleUpdate()">解析并对比</button>
    <p class="hint">新增商品将显示绿色标签，取消商品将显示红色删除线</p>
  </div>

</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="import" onclick="switchTab('import')">
    <span class="nav-icon">📥</span>
    <span class="nav-label">导入接龙</span>
  </button>
  <button class="nav-btn" data-tab="list" onclick="switchTab('list')">
    <span class="nav-icon">🛒</span>
    <span class="nav-label">采购清单</span>
  </button>
  <button class="nav-btn" data-tab="update" onclick="switchTab('update')">
    <span class="nav-icon">🔄</span>
    <span class="nav-label">更新接龙</span>
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// DATA MODEL
// customers: Array of {
//   id: string (normalized customer name),
//   name: string (original display name),
//   seqNos: number[] (sequence numbers from original 接龙),
//   isNew: boolean,
//   items: Array of {
//     id: string,
//     name: string,
//     qty: number,
//     unit: string,
//     checked: boolean,
//     status: 'normal' | 'added' | 'removed'
//   }
// }
// ============================================================

let state = {
  customers: [],
  filter: 'all',
};

// ===== PERSISTENCE =====
function saveState() {
  try {
    localStorage.setItem('sams_customers', JSON.stringify(state.customers));
    localStorage.setItem('sams_filter', state.filter);
  } catch(e) {}
}

function loadState() {
  try {
    const c = localStorage.getItem('sams_customers');
    const f = localStorage.getItem('sams_filter');
    if (c) state.customers = JSON.parse(c);
    if (f) state.filter = f;
    // FIX BUG-LS-1: adjust _idCounter to avoid collision with loaded ids
    if (state.customers.length > 0) {
      let maxIdNum = _idCounter;
      for (const c of state.customers) {
        for (const item of c.items || []) {
          if (item.id && item.id.startsWith('i')) {
            const num = parseInt(item.id.slice(1), 10);
            if (!isNaN(num) && num > maxIdNum) maxIdNum = num;
          }
        }
      }
      _idCounter = maxIdNum + 1;
    }
  } catch(e) {}
}

// ============================================================
// PARSING ENGINE — v2 重写版
// 核心改进：
// 1. 品牌词表检测 → 精确识别客户名/商品边界
// 2. 智能分词 → 处理单空格分隔、全角句号等
// 3. "数字+非数字"交替模式拆分 → 解决飞飞/Jody/dadayu等场景
// 4. 非商品词过滤 → 过滤纯问候行
// 5. 同名子串匹配合并 → 一丢丢正确合并
// 6. 序号保留与多序号展示
// ============================================================

// --- 品牌词管理（UI 可编辑，localStorage 持久化）---

// 默认品牌词表（首次使用时的初始值）
const DEFAULT_BRAND_WORDS = [
  'MM', "MM's", "Member's Mark", 'jimmy dean', 'Blue Monkey', 'Pan Fish',
  '海天', '优诺', '蒙牛', '每益添', '雅漾', '山姆', '餐吧',
  '鸡蛋', '牛奶', '烤鸡', '牛肉卷', '鸡翅', '猪排', '猪蹄', '排骨',
  '披萨', '寿司', '三文鱼', '荔枝', '果汁', '泡芙', '吐司', '蛋糕',
  '饼干', '苏打饼', '矿泉水', '酸奶', '发酵乳', '冠益乳', '鸡排',
  '松饼', '咖啡', '三角酥', '皂粉', '有机奶', '黄油', '饺子',
  '芍药', '玫瑰', '茉莉', '康乃馨', '盆栽', '荔枝', '肉绒',
  '意大利面', '汉堡', '羊肉卷', '老抽', '胡柚', '龙井', '巧克力',
  '0添加',
  'Pick Up', 'pickup',
];

// 从 localStorage 加载品牌词表（若无则用默认值）
function loadBrandWords() {
  try {
    const saved = localStorage.getItem('sam_brand_words');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    }
  } catch(e) {}
  return [...DEFAULT_BRAND_WORDS];
}

function saveBrandWords(words) {
  try {
    localStorage.setItem('sam_brand_words', JSON.stringify(words));
  } catch(e) {}
}

// 当前品牌词表（运行时缓存，避免反复读 localStorage）
let _brandWords = loadBrandWords();

// 获取品牌词表
function getBrandWords() { return _brandWords; }

// 从品牌词表自动推导英文品牌（用于 splitGoodsSmart 前置分隔）
function getEnBrands() {
  return _brandWords.filter(w => /^[a-zA-Z]/.test(w) && w.length >= 2);
}

// 从品牌词表自动推导多词品牌（含空格，用于 extractNameAndGoodsV2 空格保护）
function getMultiWordBrands() {
  return _brandWords.filter(w => w.includes(' '));
}

// 兼容旧代码：BRAND_WORDS 通过函数获取最新引用
// 所有解析代码通过 getBrandWords() 访问，确保 UI 修改后立即生效
function BRAND_WORDS() { return _brandWords; }

// --- 品牌词 UI 管理 ---

function toggleBrandPanel() {
  const panel = document.getElementById('brand-panel');
  panel.classList.toggle('open');
}

function addBrandWord() {
  const input = document.getElementById('brand-add-input');
  const word = input.value.trim();
  if (!word) return;

  // 检查是否已存在（大小写不敏感）
  const exists = _brandWords.some(w => w.toLowerCase() === word.toLowerCase());
  if (exists) {
    showToast('品牌词已存在：' + word);
    return;
  }

  _brandWords.push(word);
  saveBrandWords(_brandWords);
  input.value = '';
  renderBrandTags();
  showToast('已添加：' + word);
}

function removeBrandWord(word) {
  _brandWords = _brandWords.filter(w => w !== word);
  saveBrandWords(_brandWords);
  renderBrandTags();
}

function resetBrandWords() {
  _brandWords = [...DEFAULT_BRAND_WORDS];
  saveBrandWords(_brandWords);
  renderBrandTags();
  showToast('品牌词表已恢复默认');
}

function renderBrandTags() {
  const container = document.getElementById('brand-tags');
  const countEl = document.getElementById('brand-count');
  if (!container) return;

  countEl.textContent = _brandWords.length;

  // 按类型分组：英文多词 → 英文单词 → 中文
  const multiWord = _brandWords.filter(w => w.includes(' '));
  const enSingle = _brandWords.filter(w => /^[a-zA-Z]/.test(w) && !w.includes(' '));
  const cn = _brandWords.filter(w => !/^[a-zA-Z]/.test(w));

  let html = '';

  // 多词英文品牌（黄色）
  for (const w of multiWord) {
    html += `<span class="brand-tag brand-tag-multi">${escHtml(w)}<span class="brand-tag-del" onclick="removeBrandWord('${w.replace(/'/g, "\\'")}')">✕</span></span>`;
  }
  // 英文单品牌（蓝色）
  for (const w of enSingle) {
    html += `<span class="brand-tag brand-tag-en">${escHtml(w)}<span class="brand-tag-del" onclick="removeBrandWord('${w.replace(/'/g, "\\'")}')">✕</span></span>`;
  }
  // 中文关键词（灰色）
  for (const w of cn) {
    html += `<span class="brand-tag brand-tag-cn">${escHtml(w)}<span class="brand-tag-del" onclick="removeBrandWord('${w.replace(/'/g, "\\'")}')">✕</span></span>`;
  }

  container.innerHTML = html;
}

// 非商品词/问候词：如果某客户的商品全是这些词，则过滤掉该客户
const NON_GOODS_WORDS = [
  '周末好心情', '好心情哦', '哦', '花花', '谢谢', '好的', '收到', '备注',
  '售',
];
// 更精确的纯中文问候模式（无数量后缀的短纯中文+emoji）
const GREETING_PATTERN = /^(周末好心情|好心情|谢谢|收到|备注|花花)$/;

// 数量单位
const QTY_UNITS = '桶份盒提束袋瓶罐包条根片张个只颗粒组套件份';

// --- 工具函数 ---

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function toHalfWidth(s) {
  return s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFF10 + 0x30));
}

// 判断一个词元是否是品牌词或商品起始词
// 改进：不仅检查词元开头，也检查词元是否包含商品关键词
function isBrandOrGoodsStart(word) {
  const w = word.replace(/^[\s：:]+/, '');
  // 归一化中间连接符用于品牌匹配（"pick·up" → "pick up"）
  const wNorm = w.replace(/[·\-_]/g, ' ');
  for (const brand of BRAND_WORDS()) {
    if (w.startsWith(brand) || w.toLowerCase().startsWith(brand.toLowerCase())) return true;
    if (wNorm.startsWith(brand) || wNorm.toLowerCase().startsWith(brand.toLowerCase())) return true;
    // 也检查包含关系（如 "妃子笑荔枝" 包含 "荔枝"）
    if (brand.length >= 2 && w.includes(brand)) return true;
    if (brand.length >= 2 && wNorm.includes(brand)) return true;
  }
  return false;
}

// 判断一个词是否是非商品/问候词
function isNonGoodsWord(word) {
  const w = word.trim().replace(/[^\u4e00-\u9fff\w]/g, '');
  if (!w || w.length < 2) return true; // 太短的非中文词
  for (const ng of NON_GOODS_WORDS) {
    if (w.includes(ng) || ng.includes(w)) return true;
  }
  if (GREETING_PATTERN.test(w)) return true;
  return false;
}

// --- 核心解析函数 ---

/**
 * 从商品字符串中提取名称和数量 v2
 * 改进：
 * 1. 处理以0开头的规格数字（如"0添加"不视为数量）
 * 2. 处理 "100g*24*1" 类规格：最后的 *1 是件数，*24 是规格
 */
function parseQty(token) {
  let t = token.trim();
  if (!t || t.length === 0) return null;

  // 预处理：处理 "名称规格*数量" 模式
  // 例如 "蒙牛冠益乳发酵乳100g*24*1" → name="蒙牛冠益乳发酵乳100g*24", qty=1
  // 例如 "鸡排松饼组合*1" → name="鸡排松饼组合", qty=1
  // 例如 "鸡蛋*1" → name="鸡蛋", qty=1
  const specQtyMatch = t.match(/^(.+?)[*×xX]\s*(\d+)\s*$/);
  if (specQtyMatch) {
    const namePart = specQtyMatch[1].replace(/[*×xX\s]+$/, '').trim();
    const qty = parseInt(toHalfWidth(specQtyMatch[2]), 10) || 1;
    if (namePart.length >= 1) {
      // 检查 namePart 中是否还有 "规格*数量" 模式（如 100g*24）
      // 如果有，那是规格，保留在名字中
      return { name: namePart, qty, unit: '' };
    }
  }

  // 尝试从尾部提取 数字+[整半]+单位
  // 支持 "1整份"、"2半盒"、"3提" 等模式
  let m = t.match(new RegExp('^(.*?)\\s*([2-9]\\d*|[1-9]\\d*)\\s*([整半]?[' + QTY_UNITS + '])?\\s*$'));

  // 如果没匹配到（可能 qty=1 或 无数量），再试宽松匹配
  if (!m) {
    m = t.match(new RegExp('^(.*?)\\s*([1-9]\\d*)\\s*([整半]?[' + QTY_UNITS + '])?\\s*$'));
  }

  if (m) {
    let namePart = m[1].replace(/[*×xX\s]+$/, '').trim();
    // 清理末尾标点
    namePart = namePart.replace(/[：:，,；;、．.]+$/, '').trim();
    const qty = parseInt(toHalfWidth(m[2]), 10) || 1;
    const unit = m[3] || '';
    if (namePart.length >= 1) {
      return { name: namePart, qty, unit };
    }
  }

  // 无数量 → qty=1
  let namePart = t.replace(/[：:，,；;、．.*×xX\s]+$/, '').trim();

  // 检测尾部无数字前缀的单位词（如 "整份"、"半份"）
  // "山姆餐吧：MM肉食爱好者披萨整份" → name="山姆餐吧：MM肉食爱好者披萨", unit="整份"
  const trailingUnitMatch = namePart.match(/^(.+?)([整半]?[桶份盒提束袋瓶罐包条根片张个只颗粒组套件])$/);
  if (trailingUnitMatch && trailingUnitMatch[1].length >= 2) {
    return { name: trailingUnitMatch[1], qty: 1, unit: trailingUnitMatch[2] };
  }

  if (namePart.length >= 1) {
    return { name: namePart, qty: 1, unit: '' };
  }
  return null;
}

/**
 * 智能商品分词 v3
 * 改进：
 * 1. 加入 ． 全角句号作为分隔符
 * 2. 对无法用分隔符切分的长串，使用 "文字+数字" 交替模式智能拆分
 * 3. 即使短文本也尝试智能拆分（解决 "餐吧牛肉芝士卷2 鲜切羔羊肉卷" 等14字场景）
 * 4. 在品牌词前面的空格处主动切分（解决 "妃子笑荔枝 MM烤鸡1"）
 */
function splitGoodsSmart(rawText) {
  if (!rawText) return [];

  // Step 0: 在英文品牌词前面的空格处插入分隔符
  // 例如 "妃子笑荔枝 MM烤鸡1" → "妃子笑荔枝 |MM烤鸡1"
  // 英文品牌词从品牌词表自动推导
  let preprocessed = rawText;
  const EN_BRANDS = getEnBrands();
  for (const brand of EN_BRANDS) {
    if (brand.length < 2) continue;
    const re = new RegExp('([^\\s])\\s+(' + brand.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    preprocessed = preprocessed.replace(re, '$1|$2');
  }

  // Step 1: 替换所有已知分隔符
  let s = preprocessed
    .replace(/[，,；;、]/g, '|')
    .replace(/[．.+]/g, '|')       // 全角句号 / 加号
    .replace(/\s{2,}/g, '|')       // 2+空格
    .replace(/\s*\+\s*/g, '|');    // + 号

  // Step 2: 按管道符初步切分
  let parts = s.split('|').map(p => p.trim()).filter(p => p.length > 0);

  // Step 3: 对每个段尝试智能拆分（解决单空格分隔问题）
  const result = [];
  for (const part of parts) {
    const subParts = trySplitByPattern(part);
    result.push(...subParts);
  }

  return result;
}

/**
 * 用 "商品名(非数字)+数量(数字+单位)" 重复模式拆分长文本 v3
 *
 * 修复：
 * - 去掉 text.length <= 20 的短路判断（短文本也需要拆分）
 * - 正确处理尾部无数量商品（如 "冷萃龙井"、"鲜切羔羊肉卷"）
 * - "数字" 后跟中文字符+空格 视为商品边界
 *
 * 示例:
 * "MM韩式风味烤鸡翅1 餐吧对面寿司1" → ["MM韩式风味烤鸡翅1", "餐吧对面寿司1"]
 * "餐吧牛肉芝士卷2 鲜切羔羊肉卷" → ["餐吧牛肉芝士卷2", "鲜切羔羊肉卷"]
 * "胡柚1提 冷萃龙井1提" → ["胡柚1提", "冷萃龙井1提"]
 * "康乃馨盆栽1 黄油千层吐司1 三重芝士半蒸蛋糕1" → ["康乃馨盆栽1", ...]
 */
function trySplitByPattern(text) {
  // 只在文本包含空格时才尝试模式拆分
  // 不含空格的单一 token（如 "蒙牛冠益乳发酵乳100g*24*1"）不应被拆分
  if (!/\s/.test(text)) {
    return [text];
  }

  // 如果不含数字，直接返回
  if (!/\d/.test(text)) {
    return [text];
  }

  // 使用 "非数字+数字+单位" 全局匹配找到所有 数字边界点
  // 修复：使用 [1-9] 而非 [0-9]，避免将 "0添加"/"0冰糖老抽" 中的 "0" 误判为数量边界
  const UNIT_CHARS = '桶份盒提束袋瓶罐包条根片张个只颗粒组套件';
  const pattern = new RegExp('([^0-9]+?)([1-9][0-9]*)([' + UNIT_CHARS + ']*)', 'g');

  // 收集所有匹配的位置
  const matches = [];
  let m;
  while ((m = pattern.exec(text)) !== null) {
    const namePart = m[1].trim();
    if (namePart.length < 1) continue;
    matches.push({
      index: m.index,
      end: m.index + m[0].length,
      namePart: namePart,
      numPart: m[2],
      unitPart: m[3] || '',
      fullMatch: m[0]
    });
  }

  // 没有匹配到任何 "文字+数字" 模式 → 返回原文
  if (matches.length === 0) {
    return [text];
  }

  // 只有1个匹配且覆盖了大部分文本 → 不拆分
  if (matches.length === 1 && matches[0].index === 0 && matches[0].end >= text.length - 2) {
    return [text];
  }

  // 有多个匹配，或者1个匹配后面还有文本 → 按匹配位置拆分
  const results = [];
  let lastEnd = 0;

  for (let i = 0; i < matches.length; i++) {
    const match = matches[i];

    // match 之前的文本（上次匹配到这次匹配之间）
    if (match.index > lastEnd) {
      const between = text.slice(lastEnd, match.index).trim();
      if (between.length > 0) {
        if (results.length > 0 && between.length <= 8 && !/\d/.test(between)) {
          // 短的、无数字的文本可能是上一个商品的尾巴（如 "整份"）
          results[results.length - 1] += between;
        } else {
          results.push(between);
        }
      }
    }

    // 当前匹配的商品（名字+数字+单位）
    const item = match.namePart + match.numPart + match.unitPart;
    results.push(item);
    lastEnd = match.end;

    // 关键判断：数字后面紧跟中文字符（不是单位） → 说明这是商品边界
    // 例如 "芝士卷2鲜切羔羊肉卷" → "芝士卷2" 和 "鲜切羔羊肉卷"
    // 但 "胡柚1提" → "提" 是单位，不应拆分
    const afterMatch = text.slice(lastEnd);
    if (afterMatch.length > 0 && /^[\u4e00-\u9fff]/.test(afterMatch) && match.unitPart === '') {
      // 数字后面紧跟中文且没有单位 → 商品边界在数字后面
      // 不做额外处理，让下一个循环自然拆分
    }
  }

  // 处理尾部剩余文本
  if (lastEnd < text.length) {
    const tail = text.slice(lastEnd).trim();
    if (tail.length >= 2) {
      // 如果尾部无数字且较短，可能是上一个商品的补充
      if (results.length > 0 && tail.length <= 8 && !/\d/.test(tail)) {
        // 检查是否像商品名（而非上一个商品的修饰词）
        // 启发式：如果上一个结果已经含数字，且尾部是新的中文词组 → 独立商品
        const lastResult = results[results.length - 1];
        if (/\d/.test(lastResult) && tail.length >= 4) {
          // 上一个有数字，尾部是较长中文 → 可能是独立商品
          results.push(tail);
        } else {
          // 较短 → 归入上一个
          results[results.length - 1] += tail;
        }
      } else {
        results.push(tail);
      }
    }
  }

  // 如果最终只有1个结果且和原文差不多 → 不拆分
  if (results.length <= 1) {
    return [text];
  }

  return results;
}

/**
 * 从接龙行中提取客户名和商品文本 v2
 *
 * 改进策略：
 * 1. 先按空格分词
 * 2. 遍历词元，遇到以下信号停止扩展名字：
 *    a. 词元以数字结尾（商品+数量粘连）
 *    b. 词元是已知品牌/商品起始词
 *    c. 词元是分隔符（，,；; 等）
 *    d. 已积累足够长的名字（>=2个词元 且 含中文名特征）
 * 3. 限制最大名字长度为约8个字符
 * 4. 整行无明确商品信号 → 整行当名字（后续可能有续行）
 */
function extractNameAndGoodsV2(rest) {
  if (!rest) return { name: '', goods: '' };

  // 移除行首冒号/空格
  rest = rest.replace(/^[\s：:\-—]+/, '').trim();
  if (!rest) return { name: '', goods: '' };

  // 预处理：将多词品牌名的内部空格替换为不可分割标记
  // 例如 "pick up 巧克力" → "pick·up 巧克力"
  // 这样按空格分词时 "pick up" 不会被拆成两个词元
  // 多词品牌从品牌词表自动推导
  const MULTI_WORD_BRANDS = getMultiWordBrands();
  for (const brand of MULTI_WORD_BRANDS) {
    if (brand.includes(' ')) {
      const escaped = brand.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      rest = rest.replace(new RegExp(escaped, 'gi'), brand.replace(/ /g, '·'));
    }
  }

  // 按空格分词
  const parts = rest.split(/\s+/).filter(p => p.length > 0);

  if (parts.length === 0) return { name: '', goods: '' };

  // 单个词元：检查是否包含内嵌商品信息
  if (parts.length === 1) {
    const p = parts[0];
    // 如 "猪肋排1，猪蹄1..." → 无名字，全部当商品
    if (/[\d，,；;、]/.test(p)) {
      return { name: '', goods: p };
    }
    // 如 "妮" 或 "飞飞" → 纯名字，无商品（等续行）
    return { name: p, goods: '' };
  }

  // 多个词元：逐个判断名字边界
  // 特殊情况：如果第一个词元就是品牌词/商品词，说明整行没有客户名
  if (isBrandOrGoodsStart(parts[0])) {
    return { name: '', goods: rest };
  }

  let nameEndIndex = 1; // 至少包含第一个词元作为名字

  for (let i = 1; i < parts.length; i++) {
    const p = parts[i];
    const prevP = parts[i - 1];

    // 信号a: 当前词元以数字结尾 → 商品开始
    if (/\d$/.test(p) && !/^[\u4e00-\u9fff]{1,2}$/.test(p)) {
      nameEndIndex = i;
      break;
    }

    // 信号b: 当前词元是品牌/商品词
    if (isBrandOrGoodsStart(p)) {
      nameEndIndex = i;
      break;
    }

    // 信号c: 当前词元是分隔符
    if (/^[，,；;、]/.test(p)) {
      nameEndIndex = i;
      break;
    }

    // 信号d: 前一词元以数字结尾 → 已经在商品区了
    if (i > 1 && /\d$/.test(prevP)) {
      nameEndIndex = i;
      break;
    }

    // 名字长度限制：累计字符数不超过~10，词元数不超过~3
    const nameSoFar = parts.slice(0, i + 1).join(' ');
    if (nameSoFar.length > 10 && i >= 1) {
      nameEndIndex = i;
      break;
    }
    if (i >= 3) {
      nameEndIndex = i;
      break;
    }

    nameEndIndex = i + 1;
  }

  const name = parts.slice(0, nameEndIndex).join(' ').trim();
  const goods = parts.slice(nameEndIndex).join(' ').trim();

  return { name, goods };
}

/**
 * 主解析器 v2
 * 输入原始接龙文本，输出结构化的客户列表
 */
function parseOrderText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

  // Phase 1: 构建序号槽位（seqNo -> {name, goodsLines[]})
  const slots = new Map(); // seqNo -> slot object
  let lastSeq = null;

  for (const line of lines) {
    // 匹配主导行: 数字 + 点
    const leadMatch = line.match(/^(\d+)[.．。]\s*(.*)/);
    if (leadMatch) {
      const seqNo = parseInt(leadMatch[1], 10);
      const rest = leadMatch[2].trim();

      if (!slots.has(seqNo)) {
        slots.set(seqNo, { seqNo, name: '', goodsLines: [] });
      }
      const slot = slots.get(seqNo);

      const { name, goods } = extractNameAndGoodsV2(rest);

      // 如果该槽位还没有名字，设置名字
      if (!slot.name && name) {
        slot.name = name;
      }
      // 如果提取到了商品文本，加入
      if (goods) {
        slot.goodsLines.push(goods);
      }
      // 即使没提取到商品但有名字（可能是纯名字行），也记录（等续行）

      lastSeq = seqNo;
    } else {
      // 续行：归属上一个槽位
      if (lastSeq !== null && slots.has(lastSeq)) {
        const slot = slots.get(lastSeq);
        if (line.length >= 1) {
          // 修复：纯数量续行（如 "1整份"、"2提"、"1"）应回附到上一商品行
          // 而非作为独立商品行
          const trimmed = line.trim();
          const isQtyOnlyLine = /^[1-9]\d*[整半]?[桶份盒提束袋瓶罐包条根片张个只颗粒组套件]?$/.test(trimmed);
          if (isQtyOnlyLine && slot.goodsLines.length > 0) {
            slot.goodsLines[slot.goodsLines.length - 1] += ' ' + trimmed;
          } else if (trimmed.length > 0) {
            slot.goodsLines.push(trimmed);
          }
        }
      }
    }
  }

  // Phase 2: 将槽位转换为客户对象，并按归一化名字合并
  const customerMap = new Map(); // normName -> customer
  const orderedKeys = [];

  for (const [seqNo, slot] of [...slots.entries()].sort((a, b) => a[0] - b[0])) {
    // 修复：逐行独立解析商品，而非合并为一个大字符串
    // 原因：接龙续行通常是独立商品行（如 Yancy 的3行分别是3个不同商品）
    // 合并后会导致 trySplitByPattern 跨行误拆
    let rawTokens = [];
    for (const line of slot.goodsLines) {
      rawTokens.push(...splitGoodsSmart(line));
    }
    const items = [];

    for (const token of rawTokens) {
      const parsed = parseQty(token);
      if (!parsed) continue;

      // 还原多词品牌名的中间连接符（"Pick·Up" → "Pick Up"）
      const cleanName = parsed.name.trim().replace(/·/g, ' ');
      if (!cleanName || cleanName.length < 1) continue;

      // 跳过明显非商品词
      const stripped = cleanName.replace(/[^\u4e00-\u9fff\w]/g, '');
      if (stripped.length < 1) continue;
      if (/^(售|备注|已|谢谢|好的|收到)$/i.test(cleanName)) continue;

      items.push({
        id: generateId(),
        name: cleanName,
        qty: parsed.qty,
        unit: parsed.unit,
        checked: false,
        status: 'normal',
      });
    }

    // 无有效商品 → 判断是否为问候行
    if (items.length === 0) {
      // 如果连名字都没有或者名字看起来像问候 → 跳过整个槽位
      if (!slot.name || isNonGoodsWord(slot.name)) {
        continue;
      }
      // 有名字但无商品 → 可能是后续才有商品的名字行（如 "葱姐"）
      // 仍然创建客户但标记为空（后续合并时补充）
      // 实际上这种情况在正常数据中不应该单独存在
      // 保守起见，跳过
      continue;
    }

    // 归一化客户名用于合并（还原连接符）
    const displayName = slot.name.replace(/·/g, ' ');
    const normName = normalizeCustomerName(displayName);

    if (customerMap.has(normName)) {
      // 同名客户：合并商品 + 追加序号
      const existing = customerMap.get(normName);
      mergeItemsInto(existing.items, items);
      if (!existing.seqNos.includes(seqNo)) {
        existing.seqNos.push(seqNo);
      }
    } else {
      customerMap.set(normName, {
        id: normName,
        name: displayName,
        seqNos: [seqNo],
        isNew: false,
        items,
      });
      orderedKeys.push(normName);
    }
  }

  return orderedKeys.map(k => customerMap.get(k));
}

/**
 * 客户名归一化 v2
 * 改进：支持子串匹配合并
 * 例如 "一丢丢" 和 "一丢丢 妃子笑荔枝" 应该合并
 */
function normalizeCustomerName(name) {
  if (!name) return '';
  return name.replace(/\s+/g, ' ').trim().toLowerCase();
}

/**
 * 检查两个客户名是否应该合并（子串匹配）
 */
function shouldMergeNames(nameA, nameB) {
  if (!nameA || !nameB) return false;
  const a = normalizeCustomerName(nameA);
  const b = normalizeCustomerName(nameB);
  if (a === b) return true;
  // 子串匹配：短的是长的的前缀
  const shorter = a.length <= b.length ? a : b;
  const longer = a.length <= b.length ? b : a;
  if (longer.startsWith(shorter) && shorter.length >= 2) return true;
  return false;
}

/**
 * 合并新商品到已有商品列表（去同名累加数量）
 */
function mergeItemsInto(existingItems, newItems) {
  const existNorms = new Map(existingItems.map(i => [i.name.toLowerCase().replace(/\s+/g, ''), i]));
  for (const ni of newItems) {
    const norm = ni.name.toLowerCase().replace(/\s+/g, '');
    if (existNorms.has(norm)) {
      existNorms.get(norm).qty += ni.qty;
    } else {
      existingItems.push(ni);
    }
  }
}

// ===== DIFF ENGINE v2 (修复 MEDIUM bugs) =====

function diffAndApply(newCustomers) {
  const existingMap = new Map(state.customers.map(c => [c.id, c]));
  const newMap = new Map(newCustomers.map(c => [c.id, c]));

  let addedItems = 0, removedItems = 0, newCustomerCount = 0;
  const processedIds = new Set();

  for (const existing of state.customers) {
    processedIds.add(existing.id);
    if (!newMap.has(existing.id)) {
      for (const item of existing.items) {
        if (item.status !== 'removed') {
          item.status = 'removed';
          removedItems++;
          // FIX BUG-DIFF-2: 保留 checked 原值（不再强制 false）
        }
      }
      existing.isNew = false;
      continue;
    }

    const newC = newMap.get(existing.id);

    // FIX BUG-DIFF-1: 构建 existNormMap 时过滤掉 status==='removed' 的条目
    const existNormMap = new Map(
      existing.items
        .filter(i => i.status !== 'removed')
        .map(i => [i.name.toLowerCase().replace(/\s+/g, ''), i])
    );
    const newNormMap = new Map(
      newC.items.map(i => [i.name.toLowerCase().replace(/\s+/g, ''), i])
    );

    for (const [norm, item] of existNormMap) {
      if (!newNormMap.has(norm) && item.status !== 'removed') {
        item.status = 'removed';
        removedItems++;
      }
    }

    for (const [norm, newItem] of newNormMap) {
      if (!existNormMap.has(norm)) {
        newItem.status = 'added';
        existing.items.push(newItem);
        addedItems++;
      }
    }
    existing.isNew = false;
  }

  for (const newC of newCustomers) {
    if (!processedIds.has(newC.id)) {
      newC.isNew = true;
      for (const item of newC.items) { item.status = 'added'; }
      state.customers.push(newC);
      newCustomerCount++;
      addedItems += newC.items.length;
    }
  }

  return { addedItems, removedItems, newCustomerCount };
}

// ===== ID GENERATOR =====
let _idCounter = Date.now();
function generateId() { return 'i' + (++_idCounter); }

// ===== UI HELPERS =====
function showToast(msg, duration = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  // Fix: use querySelector with attribute selector for data-tab
  const btn = document.querySelector('.nav-btn[data-tab="' + tab + '"]');
  if (btn) btn.classList.add('active');
  document.getElementById('main-content').scrollTop = 0;
  if (tab === 'list') renderList();
}

function setFilter(f) {
  state.filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  renderList();
  saveState();
}

// ===== STATS =====
function computeStats() {
  let totalItems = 0, doneItems = 0;
  for (const c of state.customers) {
    for (const item of c.items) {
      if (item.status === 'removed') continue;
      totalItems++;
      if (item.checked) doneItems++;
    }
  }
  return {
    customers: state.customers.length,
    total: totalItems,
    done: doneItems,
    pct: totalItems > 0 ? Math.round(doneItems / totalItems * 100) : 0,
  };
}

// ===== RENDER LIST (with seq no display) =====
function renderList() {
  const hasData = state.customers.length > 0;
  document.getElementById('list-empty').style.display = hasData ? 'none' : 'block';
  document.getElementById('list-content').style.display = hasData ? 'block' : '';
  if (!hasData) return;

  const stats = computeStats();
  document.getElementById('stat-customers').textContent = stats.customers;
  document.getElementById('stat-total').textContent = stats.total;
  document.getElementById('stat-done').textContent = stats.done;
  document.getElementById('progress-pct').textContent = stats.pct + '%';
  document.getElementById('progress-fill').style.width = stats.pct + '%';

  document.getElementById('header-subtitle').textContent =
    `${stats.customers} 位客户 · ${stats.done}/${stats.total} 件已采购`;

  const searchQ = (document.getElementById('search-input').value || '').trim().toLowerCase();
  const filter = state.filter;

  const container = document.getElementById('card-list');
  container.innerHTML = '';

  for (const customer of state.customers) {
    const visibleItems = customer.items.filter(item => {
      if (filter === 'pending') return !item.checked && item.status !== 'removed';
      if (filter === 'done') return item.checked;
      return true;
    });

    const countableItems = customer.items.filter(i => i.status !== 'removed');
    const doneCount = countableItems.filter(i => i.checked).length;
    const totalCount = countableItems.length;
    const allDone = totalCount > 0 && doneCount === totalCount;

    // Search filter
    if (searchQ) {
      const nameMatch = customer.name.toLowerCase().includes(searchQ);
      const seqMatch = customer.seqNos.some(s => String(s).includes(searchQ));
      const itemMatch = customer.items.some(i => i.name.toLowerCase().includes(searchQ));
      if (!nameMatch && !seqMatch && !itemMatch) continue;
    }

    if (filter !== 'all' && visibleItems.length === 0) continue;

    // Card element
    const card = document.createElement('div');
    card.className = 'customer-card' +
      (customer.isNew ? ' new-customer' : '') +
      (allDone ? ' all-done' : '');

    // 序号标签格式: "#2" 或 "#15,16"
    const seqLabel = customer.seqNos && customer.seqNos.length > 0
      ? '#' + customer.seqNos.join(',')
      : '';

    // Header with seq tag + customer name
    const badgeClass = allDone ? 'badge-done' : 'badge-progress';
    const badgeText = allDone ? '✓ 完成' : `${doneCount}/${totalCount}`;

    card.innerHTML =
      '<div class="card-header">' +
        '<div class="customer-name-row">' +
          (seqLabel ? '<span class="seq-tag">' + escHtml(seqLabel) + '</span>' : '') +
          '<span class="customer-name">' + escHtml(customer.name) + '</span>' +
          (customer.isNew ? '<span class="customer-tag tag-new-customer">新客户</span>' : '') +
        '</div>' +
        '<span class="badge ' + badgeClass + '">' + badgeText + '</span>' +
      '</div>' +
      '<div class="card-body-wrap card-items" id="items-' + customer.id.replace(/[^a-z0-9]/gi,'_') + '"></div>';

    container.appendChild(card);

    // Items
    const itemsContainer = card.querySelector('.card-body-wrap');

    const displayItems = searchQ
      ? customer.items.filter(i => {
          const nameMatch = customer.name.toLowerCase().includes(searchQ);
          return nameMatch || i.name.toLowerCase().includes(searchQ);
        })
      : visibleItems.length > 0 ? visibleItems : customer.items;

    for (const item of displayItems) {
      const row = document.createElement('div');
      row.className = 'item-row';

      const isRemoved = item.status === 'removed';
      const isAdded = item.status === 'added';
      const isDone = item.checked && !isRemoved;

      let nameClass = 'item-name';
      if (isDone) nameClass += ' done';
      else if (isAdded) nameClass += ' added';
      else if (isRemoved) nameClass += ' removed';

      let checkboxClass = 'item-checkbox';
      if (isDone) checkboxClass += ' checked';
      if (isRemoved) checkboxClass += ' removed';

      const qtyLabel = item.qty > 1 || item.unit
        ? '<span class="qty-badge">' + item.qty + (item.unit || '') + '</span>'
        : '';
      const tagHtml = isAdded
        ? '<span class="item-tag tag-added">新增</span>'
        : isRemoved
          ? '<span class="item-tag tag-removed">已取消</span>'
          : '';

      row.innerHTML =
        '<div class="' + checkboxClass + '" data-iid="' + item.id + '" data-cid="' + escHtml(customer.id) + '"' + (isRemoved ? '' : ' onclick="toggleItem(this)"') + '></div>' +
        '<span class="' + nameClass + '">' + escHtml(item.name) + '</span>' +
        qtyLabel +
        tagHtml;

      itemsContainer.appendChild(row);
    }
  }

  if (container.children.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><p>没有符合条件的结果</p></div>';
  }
}

// ===== TOGGLE ITEM =====
function toggleItem(el) {
  const iid = el.dataset.iid;
  const cid = el.dataset.cid;
  const customer = state.customers.find(c => c.id === cid);
  if (!customer) return;
  const item = customer.items.find(i => i.id === iid);
  if (!item || item.status === 'removed') return;
  item.checked = !item.checked;
  saveState();
  renderList();
}

// ===== IMPORT =====
function handleImport() {
  const text = document.getElementById('import-text').value.trim();
  if (!text) { showToast('请先粘贴接龙文本'); return; }

  const customers = parseOrderText(text);
  if (customers.length === 0) {
    showToast('未识别到有效接龙数据，请检查格式');
    return;
  }

  state.customers = customers;
  saveState();
  document.getElementById('clear-btn').style.display = 'block';
  showToast('解析成功：' + customers.length + ' 位客户');
  setTimeout(() => switchTab('list'), 400);
}

// ===== UPDATE / DIFF =====
function handleUpdate() {
  const text = document.getElementById('update-text').value.trim();
  if (!text) { showToast('请先粘贴最新接龙文本'); return; }
  if (state.customers.length === 0) {
    showToast('请先在「导入接龙」导入初始数据');
    return;
  }

  const newCustomers = parseOrderText(text);
  if (newCustomers.length === 0) {
    showToast('未识别到有效数据');
    return;
  }

  const result = diffAndApply(newCustomers);
  saveState();

  const summaryEl = document.getElementById('diff-summary');
  summaryEl.style.display = 'block';
  summaryEl.innerHTML =
    '<div class="diff-summary">' +
      '<h3>对比完成</h3>' +
      '<div class="diff-row">' +
        '<span class="diff-plus">+' + result.addedItems + '</span> 项新增商品 &nbsp;' +
        '<span class="diff-minus">-' + result.removedItems + '</span> 项取消商品 &nbsp;' +
        '<span class="diff-plus">+' + result.newCustomerCount + '</span> 位新客户' +
      '</div>' +
    '</div>';

  showToast('对比完成：新增' + result.addedItems + '项，取消' + result.removedItems + '项');
  setTimeout(() => switchTab('list'), 600);
}

// ===== CLEAR ALL =====
function handleClearAll() {
  if (!confirm('确认清空所有数据并重新开始？已勾选的采购进度将丢失。')) return;
  state.customers = [];
  state.filter = 'all';
  saveState();
  document.getElementById('import-text').value = '';
  document.getElementById('update-text').value = '';
  document.getElementById('diff-summary').style.display = 'none';
  document.getElementById('clear-btn').style.display = 'none';
  setFilter('all');
  renderList();
  showToast('已清空，可重新导入');
  switchTab('import');
}

// ===== INIT =====
function init() {
  loadState();
  renderBrandTags();
  if (state.customers.length > 0) {
    document.getElementById('clear-btn').style.display = 'block';
    renderList();
  }
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === state.filter);
  });
}

init();

// --- PWA: Register Service Worker ---
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(reg => {
    console.log('SW registered:', reg.scope);
  }).catch(err => {
    console.log('SW registration failed:', err);
  });
}
</script>

=============================================================

【修复的 Bug 清单】

BUG-3 ✅ 缺客户名 → extractNameAndGoodsV2 返回 name='' 时整行当商品，标记为"接龙{序号}"

DIFF-1 ✅ existNormMap 过滤 status==='removed'

【新增功能】
✅ 接龙序号保留与显示：每个客户卡片显示 #序号 标签，多序号合并为 #15,16

【v2 核心策略】

1. 品牌词表 (BRAND_WORDS)
   包含 MM、Member's Mark、jimmy dean、Blue Monkey、Pan Fish、海天 等品牌，
   以及常见商品关键词（鸡蛋、牛奶、烤鸡等）。
   当分词遍历到这些词时立即停止扩展客户名。

2. 智能分词 (splitGoodsSmart + trySplitByPattern)
   - 先按标准分隔符切分
   - 对长段使用正则 /([^0-9]+?)([1-9][0-9]*)/g 做"名字+数字"重复模式拆分
     （v3修复：[1-9]替代[0-9]，避免"0添加"/"0冰糖老抽"中的0被误判为数量边界）
   - 尾部无数量的文本作为 qty=1 的独立商品
   - 解决了飞飞、Jody、dadayu、珊珊等所有单空格分隔场景

3. 客户名边界 (extractNameAndGoodsV2)
   - 按空格分词后逐词元遍历
   - 四种停止信号：数字结尾 / 品牌词 / 分隔符 / 超长限制
   - 限制名字最多 ~3 个词元 或 ~10 字符

4. 问候行过滤
   - 两层过滤：NON_GOODS_WORDS 黑名单 + GREETING_PATTERN 正则
   - 无有效商品的槽位直接丢弃

5. 同名合并
   - 归一化名字（小写+去空格）完全匹配
   - 子串匹配辅助（短名是长名前缀）

6. 序号保留
   - 每个客户携带 seqNos: number[] 数组
